<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styleIndex.css">
    <title>API</title>
</head>

<body>



    <div id="tab" class="container">

        <div class="m-5">
            <h1 class="text-center ">Cadastre seu contato</h1>
        </div>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="cadastrar-tab" data-bs-toggle="tab" data-bs-target="#home"
                    type="button" role="tab" aria-controls="home" aria-selected="true">Cadastrar</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="buscar-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button"
                    role="tab" aria-controls="profile" aria-selected="false">Buscar</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                <form action="" class=" container form">
                    <div class="mt-5 row ">
                        <div class="col-md-6 "> <input type="text" placeholder="Nome" id="nome"></div>
                        <div class="col-md-6 "> <input type="text" placeholder="Telefone" id="telefone"></div>
                    </div>
                    <input class="mt-3 w-100 " type="submit" value="Salvar" id="salvar">
                </form>
            </div>
            <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">

                <div class="row mt-5">
                    <div class="col-md-10 d-flex justify-content-center align-items-center">
                        <input type="text" placeholder="Digite um nome" id="buscarContatos">
                    </div>
                    <div class="col-md-2 d-flex justify-content-center align-items-center">
                        <button id="buscar">buscar</button>
                    </div>
                </div>


                <div class="container mt-5" id="div-telefones">
                    <table class="" id="tabela-telefones">
                        <thead>
                            <tr>
                                <td>Id</td>
                                <td>Nome</td>
                                <td>Telefone</td>
                                <td>Ações</td>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>



  

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        
        <div class="modal fade" id="modal-edicao" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" id="modal-edicao-contato">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Editando Contato</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="">Nome</label>
                    <input type="text" id="input-nome-modal">
                    <label for="">Telefone</label>
                    <input type="text" id="input-telefone-modal">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-confirmar">Salvar</button>
                </button>
                </div>
            </div>
        </div>
    </div>

<!--Modal que é de confirmação para salvar não confundir com o de cima que é para chamar a edição-->
 <div class="modal fade" id="modal-confirmar" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" id="modal-edicao-contato">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Tem certeza que deseja salvar?</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="alterarDados()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
